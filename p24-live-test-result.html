<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Dziękujemy za test prawdziwej płatności — AXI3D</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#100916;color:#f4eefb}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#351553,#100916 58%)}
    main{width:min(620px,100%);padding:36px;border:1px solid rgba(167,139,250,.28);background:#1f1330;border-radius:12px;box-shadow:0 24px 80px rgba(0,0,0,.35);text-align:center}
    img{width:74px;height:74px;object-fit:contain;margin:0 auto 18px}.checkmark{width:72px;height:72px;margin:0 auto 20px;border:1px solid #a78bfa;border-radius:50%;display:grid;place-items:center;color:#a78bfa;font-size:2rem;box-shadow:0 0 40px rgba(109,40,217,.35)} h1{margin:0 0 12px;font-size:clamp(1.6rem,5vw,2.3rem)}
    p{color:#cfc1dc;line-height:1.65}.status{margin:24px 0;padding:16px;border-radius:8px;background:#160c21;font-weight:700}.ok{color:#7ee2a8}.wait{color:#f7c948}.error{color:#ff9292}
    a{display:inline-block;margin-top:8px;padding:12px 18px;border-radius:6px;background:#7c3aed;color:white;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main>
    <img src="logo.png" alt="AXI3D">
    <div class="checkmark" aria-hidden="true">✓</div>
    <h1 id="result-title">Sprawdzamy płatność…</h1>
    <p id="result-message">Za chwilę potwierdzimy techniczne zamówienie. W tym teście została użyta prawdziwa płatność 1,50 zł.</p>
    <div class="status wait" id="payment-status" role="status" aria-live="polite">Sprawdzanie płatności i weryfikacji…</div>
    <p id="payment-details"></p>
    <a href="p24-live-test.html#zamow">Wróć do formularza TEST LIVE</a>
  </main>
  <script>
    window.AXI_P24_LIVE_RESULT = true;
    window.AXI_P24_EXPECTED_AMOUNT = 150;
    window.AXI_P24_STATUS_ENDPOINT = 'https://axi-checkout.onrender.com/p24-live-test/status';
  </script>
  <script src="p24-test-result.js?v=20261126-p24-live-v1"></script>
</body>
</html>
