name: Redesign hero section

on:
  push:
    branches:
      - agent/redesign-od-pomyslu-do-figurki

permissions:
  contents: write

jobs:
  redesign:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/redesign-od-pomyslu-do-figurki

      - name: Rearrange hero section
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          css = r'''

  /* ---------- HERO: OD POMYSLU DO FIGURKI ---------- */
  .hero{
    padding:72px 0 64px;
  }
  .case-frame{
    grid-template-columns:minmax(0,.9fr) minmax(520px,1.1fr);
    gap:64px;
  }
  .hero-copy{
    position:relative;
    z-index:2;
  }
  .hero h1{
    font-size:clamp(2.8rem,5vw,4.5rem);
    max-width:9ch;
  }
  .hero p.lead{
    max-width:52ch;
    margin-bottom:28px;
  }
  .hero-badges{
    margin-top:28px;
  }
  .idea-flow{
    position:relative;
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:14px;
    align-items:center;
    min-height:510px;
    padding:34px 0;
  }
  .idea-flow::before{
    content:"";
    position:absolute;
    left:10%; right:10%; top:50%;
    height:1px;
    background:linear-gradient(90deg,transparent,var(--violet-bright),var(--bronze),transparent);
    opacity:.45;
  }
  .idea-card{
    position:relative;
    z-index:1;
    min-width:0;
    background:linear-gradient(180deg,rgba(31,19,48,.96),rgba(16,9,22,.94));
    border:1px solid var(--line);
    box-shadow:0 22px 48px rgba(0,0,0,.34);
    padding:12px;
    transition:transform .3s ease,border-color .3s ease,box-shadow .3s ease;
  }
  .idea-card:nth-child(2){ transform:translateY(-24px); }
  .idea-card:nth-child(3){ transform:translateY(18px); }
  .idea-card:hover{
    border-color:var(--violet-bright);
    transform:translateY(-10px);
    box-shadow:0 26px 60px rgba(0,0,0,.44),0 0 44px rgba(109,40,217,.22);
  }
  .idea-card:nth-child(2):hover,
  .idea-card:nth-child(3):hover{ transform:translateY(-10px); }
  .idea-visual{
    position:relative;
    aspect-ratio:4/5;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at 50% 32%,rgba(167,139,250,.24),transparent 62%),var(--bg-elevated);
    border:1px solid var(--line);
  }
  .idea-visual img{
    width:100%;
    height:100%;
    object-fit:contain;
    filter:drop-shadow(0 12px 24px rgba(109,40,217,.38));
    transition:transform .45s ease;
  }
  .idea-card:hover .idea-visual img{ transform:scale(1.045); }
  .idea-step{
    position:absolute;
    top:10px; left:10px;
    z-index:2;
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--violet-bright);
    background:rgba(16,9,22,.84);
    color:var(--violet-bright);
    font-family:'JetBrains Mono',monospace;
    font-size:.74rem;
    box-shadow:0 0 20px rgba(109,40,217,.45);
  }
  .idea-meta{
    padding:16px 8px 8px;
  }
  .idea-meta span{
    display:block;
    margin-bottom:6px;
    font-family:'JetBrains Mono',monospace;
    font-size:.66rem;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--bronze);
  }
  .idea-meta strong{
    display:block;
    font-family:'Cinzel',serif;
    font-size:.95rem;
    line-height:1.35;
    color:var(--ink);
  }
  .idea-arrow{
    position:absolute;
    top:50%;
    z-index:3;
    width:36px; height:36px;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line);
    border-radius:50%;
    background:var(--bg);
    color:var(--violet-bright);
    font-size:1.1rem;
    box-shadow:0 0 24px rgba(109,40,217,.34);
  }
  .idea-arrow-one{ left:31.4%; }
  .idea-arrow-two{ left:65.1%; }
  .idea-note{
    position:absolute;
    right:4px;
    bottom:0;
    padding:8px 12px;
    border-left:1px solid var(--bronze);
    color:var(--ink-dim);
    font-family:'JetBrains Mono',monospace;
    font-size:.72rem;
  }
  @media (max-width:1000px){
    .case-frame{ grid-template-columns:1fr; gap:28px; }
    .hero h1{ max-width:none; }
    .idea-flow{ min-height:0; max-width:760px; }
  }
  @media (max-width:650px){
    .idea-flow{ grid-template-columns:1fr; gap:18px; padding:12px 0 34px; }
    .idea-flow::before,.idea-arrow{ display:none; }
    .idea-card:nth-child(2),.idea-card:nth-child(3){ transform:none; }
    .idea-visual{ aspect-ratio:16/10; }
    .idea-note{ position:static; margin-top:4px; }
  }
'''

          text = text.replace('</style>', css + '\n</style>', 1)

          new_hero = r'''  <!-- HERO -->
  <section class="hero">
    <div class="wrap case-frame">
      <div class="hero-copy">
        <div class="eyebrow">Wystarczy opis albo zdjęcie</div>
        <h1>Od pomysłu<br><em>do figurki.</em></h1>
        <p class="lead">Wyślij nam opis postaci, kartę bohatera, szkic lub zdjęcie. Zamienimy materiał referencyjny w model 3D, pokażemy Ci go do akceptacji, a następnie wydrukujemy gotową figurkę z żywicy.</p>
        <div class="hero-ctas">
          <a href="#zamow" class="btn btn-primary">Stwórz swoją figurkę</a>
          <a href="#proces" class="btn btn-ghost">Zobacz jak to działa</a>
        </div>
        <div class="hero-badges">
          <div class="hero-badge">Opis, szkic lub zdjęcie</div>
          <div class="hero-badge">Podgląd modelu 360°</div>
          <div class="hero-badge">Poprawki przed drukiem</div>
        </div>
      </div>

      <div class="idea-flow" aria-label="Od materiału referencyjnego do gotowej figurki">
        <article class="idea-card">
          <div class="idea-visual">
            <span class="idea-step">01</span>
            <img src="lewzdjklienta.png" alt="Zdjęcie lub opis przesłany przez klienta">
          </div>
          <div class="idea-meta">
            <span>Twój materiał</span>
            <strong>Opis, zdjęcie lub szkic</strong>
          </div>
        </article>

        <span class="idea-arrow idea-arrow-one" aria-hidden="true">→</span>

        <article class="idea-card">
          <div class="idea-visual">
            <span class="idea-step">02</span>
            <img src="lewmodelpog.png" alt="Model 3D przygotowany do akceptacji">
          </div>
          <div class="idea-meta">
            <span>Projekt</span>
            <strong>Model 3D do akceptacji</strong>
          </div>
        </article>

        <span class="idea-arrow idea-arrow-two" aria-hidden="true">→</span>

        <article class="idea-card">
          <div class="idea-visual">
            <span class="idea-step">03</span>
            <img src="lewbeztlaproces.png" alt="Gotowa wydrukowana figurka z żywicy">
          </div>
          <div class="idea-meta">
            <span>Efekt</span>
            <strong>Gotowa figurka z żywicy</strong>
          </div>
        </article>

        <div class="idea-note">Jedna postać. Trzy proste etapy.</div>
      </div>
    </div>
  </section>

'''

          pattern = re.compile(r'  <!-- HERO -->\n  <section class="hero">.*?</section>\n\n', re.S)
          text, count = pattern.subn(new_hero, text, count=1)
          if count != 1:
              raise SystemExit('Nie znaleziono sekcji HERO do podmiany')

          path.write_text(text, encoding='utf-8')

      - name: Remove temporary workflow
        run: rm .github/workflows/redesign-hero.yml

      - name: Commit redesigned section
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/redesign-hero.yml
          git commit -m "Przearanżuj sekcję od pomysłu do figurki"
          git push origin agent/redesign-od-pomyslu-do-figurki
