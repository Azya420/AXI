name: Apply hero redesign

on:
  push:
    branches:
      - agent/hero-redesign

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hero-redesign
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update hero
        run: python scripts/apply_hero_redesign.py

      - name: Commit generated change
        run: |
          if git diff --quiet -- index.html; then
            echo "No hero changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Redesign homepage hero"
          git push
