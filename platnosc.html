<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Przekierowanie do płatności — AXI</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #100916;
    --violet: #6d28d9;
    --violet-bright: #a78bfa;
    --bronze: #c9a24b;
    --ink: #f4eefb;
    --ink-dim: #b7a8c9;
    --ink-faint: #7c6c93;
    --line: rgba(167,139,250,0.16);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Sora', sans-serif;
    line-height:1.6;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:32px;
  }
  h1{ font-family:'Cinzel', serif; font-weight:600; font-size:clamp(1.5rem, 3vw, 2rem); }
  p{ color:var(--ink-dim); max-width:44ch; margin-top:14px; }
  .spinner{
    width:40px; height:40px;
    border:2px solid var(--line);
    border-top-color:var(--violet-bright);
    border-radius:50%;
    animation:spin 0.8s linear infinite;
    margin-bottom:22px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .btn{
    display:inline-block;
    margin-top:20px;
    padding:14px 28px;
    text-decoration:none;
    font-size:0.92rem;
    font-family:'JetBrains Mono', monospace;
    letter-spacing:0.03em;
    background:var(--violet);
    color:#fff;
    border:1px solid var(--violet);
  }
  a{ color:var(--violet-bright); }
</style>
</head>
<body>

<div class="spinner" id="spinner"></div>
<h1>Przekierowujemy do płatności…</h1>
<p id="msg">Zgłoszenie zostało przyjęte. Za chwilę zostaniesz przeniesiony do bezpiecznej płatności Stripe.</p>
<a class="btn" id="fallback-link" href="/" style="display:none;">Przejdź do płatności</a>

<script>
  var STRIPE_LINKS = {
    '20–60 mm':   'https://buy.stripe.com/eVq9AU9I87Q94GP8AZeZ200',
    '70–100 mm':  'https://buy.stripe.com/8x2bJ23jK0nH8X504teZ201',
    '110–150 mm': 'https://buy.stripe.com/00w14oaMc3zTddlg3reZ202',
    '160–200 mm': 'https://buy.stripe.com/14AdRadYofiBfltaJ7eZ204',
    '210–250 mm': 'https://buy.stripe.com/8x2dRa07y4DXehpaJ7eZ205'
  };

  var params = new URLSearchParams(window.location.search);
  var bracket = params.get('bracket');
  var email = params.get('email') || '';
  var link = STRIPE_LINKS[bracket];

  if(link){
    var target = link + '?prefilled_email=' + encodeURIComponent(email);
    document.getElementById('fallback-link').href = target;
    window.location.href = target;
  } else {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('msg').textContent = 'Zgłoszenie zostało przyjęte, ale nie udało się ustalić kwoty płatności automatycznie. Napisz do nas na kontaktaxi3d@gmail.com, a wyślemy link do płatności ręcznie.';
    document.getElementById('fallback-link').style.display = 'none';
  }
</script>

</body>
</html>
