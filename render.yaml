# Konfiguracja produkcyjna; samo dodanie pliku nie wdraża istniejącej usługi.
# W Renderze ustaw gałąź main, sekret live STRIPE_SECRET_KEY i wykonaj wdrożenie.
services:
  - type: web
    name: axi-checkout
    runtime: node
    region: frankfurt
    # Plan wybierany w panelu Render. Pominięcie pola zachowuje plan istniejącej usługi.
    # Dla NOWEJ usługi Render użyje domyślnego planu płatnego — sprawdź koszt przed utworzeniem.
    branch: main
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run check && npm test
    startCommand: node api/server.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: AXI_SITE_ORIGIN
        value: https://axi3d.pl
      - key: AXI_ALLOWED_ORIGINS
        value: https://axi3d.pl,https://www.axi3d.pl
